name: Release

# Push a tag like v0.1.0 to build the desktop installers on all three platforms.
# They are attached to a draft release; review it and press Publish on GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron 44+ downloads its binary on first use, not on install
      - run: node node_modules/electron/install.js
      - run: npm run build
      # Installers are not code-signed yet (see issue #30)
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
