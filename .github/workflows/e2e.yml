name: E2E

# Pull requests to main run the end-to-end tests their changed files can affect (e2e/impact.json,
# scripts/e2e-affected.mjs); pushes to main, release tags and manual runs run the full suite.
# Every test runs twice: in Markdown mode and with the document opened straight into Rich text.
# The tests drive the Google Chrome preinstalled on GitHub's Ubuntu runners; no secrets needed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch replaces a run still in progress
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The affected-tests selection diffs against the base branch
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every file under src/ is in the impact map
        run: node scripts/e2e-affected.mjs --check
      - name: Affected tests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/e2e-affected.mjs --base "origin/$BASE_REF" -- --reporter=list,html
      - name: Full suite
        if: github.event_name != 'pull_request'
        run: npx playwright test --reporter=list,html
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
