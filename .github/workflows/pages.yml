name: Web app

# Publishing a release (or a manual run) builds the website and serves it with GitHub Pages:
# the landing page and guides at https://boudou.github.io/Markloom/, the manual (from the wiki)
# at docs/ and the editor at app/, so the site matches the latest release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: boudou/Markloom.wiki
          path: wiki
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      # The editor lives under /Markloom/app/; the desktop build keeps the default base.
      # Only this build has the Google Analytics ID, offered to visitors as opt-in usage statistics (#210)
      - run: npm run build -- --base=${{ steps.pages.outputs.base_path }}/app/
        env:
          VITE_GA_ID: G-C300N5SNN4
      - run: node scripts/build-site.mjs --wiki wiki
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
